  <text x="64" y="830" class="small">Масштаб и дорожная схема условные. Положение опорных точек перенесено приблизительно по координатам WGS84;</text>
  <text x="64" y="851" class="small">границы районов, улицы, мосты и промзона — рабочие гипотезы, требуют сверки с OSM в GIS и теста в игре.</text>
