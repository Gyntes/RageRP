<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Компактный блок-аут Тулы — итерация 0</title>
  <desc id="description">Схема центрального игрового прототипа Тулы с ориентировочным положением известных ориентиров, Упы и транспортных связей. Дорожная сеть схематична и требует сверки с GIS.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8edf2" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526174; }
      .zone-label { font-size: 14px; font-weight: 600; fill: #566578; }
      .poi-label { font-size: 13px; font-weight: 600; }
      .small { font-size: 12px; fill: #526174; }
      .tiny { font-size: 10px; fill: #526174; }
      .arterial { fill: none; stroke: #f0a44b; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .road { fill: none; stroke: #f8d59b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .local-road { fill: none; stroke: #cbd5df; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

