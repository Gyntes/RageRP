<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Звонок | Tula RP</title>
  <link rel="stylesheet" href="call.css">
</head>
<body>
  <main class="call-layer">
    <section class="call-card" role="dialog" aria-modal="true" aria-labelledby="call-title">
      <div class="call-indicator" aria-hidden="true"><span></span></div>
      <p class="eyebrow" id="call-label">RMRP · ТЕЛЕФОН</p>
      <h1 id="call-title">Звонок</h1>
      <p class="call-name" id="call-name"></p>
      <p class="call-status" id="call-status"></p>
      <div class="call-actions" id="call-actions"></div>
    </section>
  </main>
  <script src="call.js"></script>
</body>
</html>
